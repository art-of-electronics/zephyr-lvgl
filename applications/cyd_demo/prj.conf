# System logging
CONFIG_LOG=y

# Hardware peripherals
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SPI=y

# LCD display
CONFIG_CYD_ST7796S_PANEL_INIT=y
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y

# XPT2046 touchscreen
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_FORMAT_RGB565=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_PARTIAL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# LVGL fonts
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
