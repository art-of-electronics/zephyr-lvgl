# System
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# Shell
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

# Log
CONFIG_LOG=y
CONFIG_LV_USE_LOG=y

# Display
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y

# Touchscreen
CONFIG_INPUT=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_Z_PARTIAL_REFRESH=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_DEF_REFR_PERIOD=16

CONFIG_LV_USE_LABEL=y

# LVGL fonts
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_40=y

# Peripherial
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_WIFI=y

CONFIG_WIFI_ESWIFI=y
CONFIG_WIFI_ESWIFI_BUS_SPI=y
CONFIG_WIFI_ESWIFI_SHELL=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Hardware RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
