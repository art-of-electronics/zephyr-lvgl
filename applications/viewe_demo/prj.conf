# System logging
CONFIG_LOG=y

# Hardware peripherals
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y

# LCD_CAM RGB display
CONFIG_DISPLAY=y
CONFIG_ESP32_LCD_CAM_RGB=y

# LCD backlight
CONFIG_LED=y
CONFIG_LED_PWM=y

# External PSRAM
CONFIG_SPIRAM_SPEED_80M=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536

# LVGL fonts
CONFIG_LV_FONT_MONTSERRAT_48=y
