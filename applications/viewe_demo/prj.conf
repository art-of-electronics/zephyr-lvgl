# System logging
CONFIG_LOG=y
CONFIG_LOG_LCD_CAM_DIAGNOSTICS=n

# Hardware peripherals
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_LED_STRIP=y
CONFIG_PULSE_IO_ESP32_RMT=y

# LCD_CAM RGB display
CONFIG_DISPLAY=y
CONFIG_ESP32_LCD_CAM_RGB=y
CONFIG_ESP32_LCD_RGB_FRAMEBUFFER_COUNT=3

# LCD backlight
CONFIG_LED=y
CONFIG_LED_PWM=y

# External PSRAM
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_SPEED_80M=y

# GT911 touchscreen
CONFIG_INPUT=y
CONFIG_INPUT_GT911=y
# Default: POLL=y. Set INT=y only when R33 is mounted.
CONFIG_GT911_TOUCHSCREEN_POLL=y
# CONFIG_GT911_TOUCHSCREEN_INT=y

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# LVGL fonts
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
